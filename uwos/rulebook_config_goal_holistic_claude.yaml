# rulebook_config_goal_holistic_claude.yaml
# Goal-focused configuration: prioritize consistency/quality over raw count,
# while still allowing executable candidates.
#
# CHANGES vs rulebook_config_goal_holistic.yaml (targeting PF > 1.15):
#
# [T1] gates.max_leg_spread_pct:          0.18  → 0.12   (tighter liquidity; reduces fill slippage)
# [T1] gates.min_leg_volume:              20    → 40     (better fill quality)
# [T1] strategy_selection.fire_enforce_max_iv_rank: false → true  (don't overpay for debit in high-IV)
# [T1] approval.min_credit_no_touch_pct:  60.0  → 65.0   (raise Shield win-rate floor)
# [T1] playbook.stop_loss_pct_debit_max_loss:  0.55 → 0.45  (cap debit avg loss earlier)
# [T1] playbook.stop_loss_pct_debit_near_dte: 0.45 → 0.40
# [T1] playbook.stop_loss_pct_debit_mid_dte:  0.55 → 0.45
#
# [T2] approval.tactical_min_edge_pct:    5.0   → 6.5    (half-size trades need better edge)
# [T2] approval.tactical_min_signals:     120   → 150    (more historical validation for tactical)
# [T2] approval.max_spot_asof_drift_pct:  0.35  → 0.20   (prevent stale approvals)
# [T2] shield.credit_short_otm_pct:       0.10  → 0.12   (more conservative short strikes)
#
# [T3] playbook.take_profit_pct_credit_max_profit: 0.60 → 0.50  (lock in credits at 50%; reduces gamma reversal risk)
# [T3] strategy_selection.breakout_max_debit_pct_width: 0.50 → 0.40  (tighter LIC cost control)
# [T3] approval.shield_live_valid_min_no_touch_floor: 50.0  (new — floor even for live-valid override)
# [T3] approval.shield_live_valid_min_edge_floor: 4.0       (new — minimum edge even for live-valid)
#
# [T4] shield.sigma_relaxation_factor: 0.45  (new — use 0.45x sigma instead of 1.0x for credit spreads)
# [T4] shield.iron_condor_sigma_factor: 0.40 (new — IC gets relaxed sigma since both sides must pass)
# [T4] engine.min_shield_in_output: 3        (new — reserve 3 output slots for SHIELD track)
# [T4] playbook.risk_limits.max_sector_share: 0.30  (new — no more than 30% of trades in one sector)
#
# [T5] engine.min_shield_in_output: 3 → 5    (reserve 5 slots for best positive-edge SHIELD trades)
# [T5] approval.min_credit_no_touch_pct: 65 → 25  (realistic for current vol; edge gate still protects PF)
# [T5] approval.ic_exempt_from_no_touch: true (IC profitability is terminal, no-touch is path-based)
#
# [T6] Pipeline audit fixes (backtest showed 17.5% win rate, -$3,301 P&L over 3 weeks):
# [T6] fire.debit_long_max_abs_moneyness_pct: 0.08 → 0.06  (strikes closer to ATM)
# [T6] fire.max_breakeven_dist_pct: 0.12 → 0.08            (reachable breakevens)
# [T6] fire.allow_both_sides_when_neutral: false → true     (unblock bear trades)
# [T6] shield.allow_both_sides_when_neutral: false → true   (same)
# [T6] approval.max_spot_asof_drift_pct: 0.20 → 0.50       (less restrictive drift)
# [T6] approval.entry_tolerance_floor: 0.25 → 0.30         (ATM strikes have larger bid-ask)

engine:
  max_tickers_to_scan: 450
  max_trades_per_ticker: 4
  max_trades_per_ticker_per_track: 3
  max_total_trades: 250
  max_expiries_per_ticker: 8
  strike_search_depth: 12
  discovery_multiplier: 6
  eod_stage2_candidate_cap: 240       # Price a broad EOD candidate set before final High/Medium/Watch classification
  fire_expiry_coverage_repair: true    # Preserve approval-compatible FIRE expiries when 49D rows rank higher on liquidity/RR
  fire_expiry_coverage_max_dte: 45
  min_approval_compatible_fire_expiries_per_ticker_strategy: 1
  final_max_trades_per_ticker: 1
  min_per_track: 1
  min_shield_in_output: 5              # [T5] was: 3 — reserve 5 output slots for best SHIELD trades
  min_bear_in_output: 2                # [T8] reserve 2 output slots for bear FIRE trades
  max_same_direction_pct: 0.70         # [T9] max 70% of approved can be same direction (bull or bear)
  max_same_expiry_count: 8             # [T9] max 8 trades sharing one expiry date — forces DTE diversification
  external_scanner_mode: "off"         # daily pipeline ignores options_scan_* scanner artifacts
  show_external_scanner_coverage_section: false
  include_watch_candidates: true

gates:
  exclude_etfs: true
  min_credit_pct_width: 0.30
  max_credit_pct_width: 0.55
  max_debit_pct_width: 0.45           # [T6] was: 0.35 — ATM strikes cost more; 35% was rejecting valid near-ATM setups
  tactical_max_debit_pct_width: 0.35  # [T9] Tactical trades must have tighter cost/width — prevents 50%+ debit/width from leaking P&L
  tactical_debit_pct_width_tolerance: 0.02 # Soft band: tiny live price drift above tactical debit/width cap is a warning, not a cliff
  min_live_reward_risk: 1.50          # [T9] Stage-2 live R/R floor — CORZ at 0.94x would have been blocked
  min_leg_open_interest: 100
  min_leg_volume: 40                  # [T1] was: 20 — better fill quality
  max_leg_spread_pct: 0.12            # [T1] was: 0.18 — reduce bid-ask slippage impact
  max_strike_distance_pct: 0.80
  max_risk_per_trade: 700
  min_debit_reward_risk: 1.20
  min_credit_reward_risk: 0.35

  width_tiers:
    - {min_price: 0,   max_price: 25,  min_width: 2.5, max_width: 5,   default_width: 2.5}
    - {min_price: 25,  max_price: 75,  min_width: 2.5, max_width: 7.5, default_width: 5}
    - {min_price: 75,  max_price: 150, min_width: 5,   max_width: 15,  default_width: 10}
    - {min_price: 150, max_price: 1.0e9, min_width: 10, max_width: 20, default_width: 10}

fire:
  dte_range: [21, 70]
  target_dte: 45
  debit_long_itm_pct: 0.03
  debit_long_otm_pct: 0.08
  debit_long_max_abs_moneyness_pct: 0.06  # [T6] was: 0.08 — tighter OTM cap; backtest showed 17.5% win rate with 0.08
  debit_use_dual_long_targets: true
  call_pool_min_pct: 0.75
  call_pool_max_pct: 1.15
  put_pool_min_pct: 0.85
  put_pool_max_pct: 1.30
  max_breakeven_dist_pct: 0.08            # [T6] was: 0.12 — tighter BE distance; 12% was unreachable for most 30-DTE trades
  invalidation_buffer_pct: 0.03
  allow_both_sides_when_neutral: true      # [T6] was: false — allow both bull+bear in neutral zone; prevents META-like blind spots
  lotto_dte_max: 10

shield:
  dte_range: [28, 56]
  target_dte: 42
  credit_short_otm_pct: 0.18         # [T7] was: 0.12 — targets 0.20-0.30 delta short (professional standard); 0.12 gave 0.40-0.50
  sigma_relaxation_factor: 0.45       # [T4] new — use 0.45x sigma; allows ~8-10% OTM strikes to pass
  iron_condor_sigma_factor: 0.40      # [T4] new — IC needs both sides; more relaxed to allow any through
  allow_both_sides_when_neutral: true      # [T6] was: false — same as FIRE; neutral tickers can generate both tracks
  min_marketcap: 10000000000
  lotto_dte_max: 7

strategy_selection:
  # Debit trades tend to perform better when IV is not elevated.
  fire_max_iv_rank: 55
  fire_enforce_max_iv_rank: true      # [T1] was: false — enforce so debit spreads skip high-IV regimes
  # Do not silently drop high-IV/event FIRE names. Generate them as Watch/Scout
  # candidates with explicit high-IV blockers so the approval layer can allow
  # only post-event, live-confirmed Event Scout trades.
  fire_surface_high_iv_watch: true
  # Premium selling benefits from richer IV regimes.
  shield_min_iv_rank: 20
  # Range/theta structures need richer IV + neutral tape.
  range_min_iv_rank: 35
  range_min_neutrality: 0.72
  enable_iron_butterfly: true
  # Volatility breakout structure (defined-risk debit).
  enable_long_iron_condor: true
  breakout_min_implied_move_pct: 0.03
  breakout_min_neutrality: 0.20
  breakout_max_center_width_pct: 0.35
  breakout_max_debit_pct_width: 0.40  # [T3] was: 0.50 — tighter cost control on LIC structures

pricing:
  executable_source_kinds: ["hot"]

approval:
  require_likelihood_pass: true
  # If SHIELD/credit setup is live-valid (ok_live), do not hard-reject on
  # historical quality gates; keep those as informational in notes.
  shield_live_valid_overrides_quality: true
  shield_live_valid_min_no_touch_floor: 50.0  # [T3] new — floor even for live-valid override path
  shield_live_valid_min_edge_floor: 4.0        # [T3] new — minimum edge even for live-valid override
  min_edge_pct: 8.0
  min_edge_pct_bear: 12.0             # [BT] bear debit approvals scored only ~59% breakeven hit; require stronger edge
  min_edge_pct_shield: 8.0            # [BT] full-GEX replay: credit/IC approvals below 8% had poor realized quality
  min_signals: 120
  min_credit_no_touch_pct: 25.0       # [T5] was: 65.0 — lowered; realistic for current vol. Edge gate still protects PF.
  credit_no_touch_require_data: true
  ic_exempt_from_no_touch: true       # [T5] new — IC profitability is terminal (expiry-zone), no-touch is path-based
  min_likelihood_strength: Moderate
  min_likelihood_strength_bear: Moderate # [BT] Weak bear debits were the main loser cluster; require stronger evidence
  min_likelihood_strength_shield: Weak # [T8] same for credit spreads
  disallow_likelihood_strengths: [Low Sample, Negative, Negative-Strong, N/A]

  allow_stage1_watch_promotion: true
  earnings_buffer_days: 7
  flow_direction_threshold: 0.08
  flow_strength_threshold: 0.15
  flow_premium_threshold: 0.08
  flow_volume_conflict_threshold: 0.10
  flow_strong_threshold: 0.30
  contract_flow_bias_threshold: 0.10
  income_contract_flow_directional_threshold: 0.25
  stage1_watch_promotion_min_conviction: 55
  stage1_watch_promotion_min_edge_pct: 8.0
  stage1_watch_promotion_min_signals: 150
  allow_fire_breakout_exception: true
  fire_breakout_min_conviction: 40
  fire_breakout_min_edge_pct: 12.0
  fire_breakout_min_signals: 120
  fire_breakout_min_long_delta: 0.35
  fire_breakout_require_risk_on: true
  fire_breakout_max_wall_distance_pct: 0.01
  # Backtest-calibrated bull-call evidence lane.
  # This does not broadly approve Watch rows: it only promotes FIRE bull-call
  # debits with PASS likelihood, enough samples, <=35 DTE, acceptable live
  # delta/entry/reward-risk, no confirmed bearish ticker flow, and confirmed
  # contract-neighborhood flow. Missing UW GEX keeps the trade Tactical rather
  # than Core.
  allow_bull_call_evidence_lane: true
  bull_call_evidence_min_edge_pct: 8.0
  bull_call_evidence_min_signals: 120
  bull_call_evidence_min_conviction: 30
  bull_call_evidence_min_long_delta: 0.30
  bull_call_evidence_max_dte: 35
  bull_call_evidence_min_reward_risk: 2.0
  bull_call_evidence_require_contract_confirmed: true
  bull_call_evidence_allow_gex_missing: true
  # Positive-edge bearish evidence lane:
  # This is the practical middle lane for live-valid bear-put debit spreads
  # that the old Stage-1 conviction score under-rates. It is still gated by
  # PASS likelihood, positive edge, contract-flow confirmation, IV, DTE, and
  # debit/width quality. It does not reuse the contrarian Bear Scout model.
  # Disabled after 84-day replay on 2026-04-24:
  # the broad positive-edge bear-put lane increased opportunity but regressed
  # PF from 7.18 to 3.86 and win rate from 75.8% to 61.8%.
  # Keep the code path available for narrower calibration, but do not trade it.
  allow_bear_put_evidence_lane: false
  bear_put_evidence_min_edge_pct: 12.0
  bear_put_evidence_min_signals: 120
  bear_put_evidence_min_conviction: 30
  bear_put_evidence_min_long_delta: 0.25
  bear_put_evidence_min_dte: 14
  bear_put_evidence_max_dte: 60
  bear_put_evidence_min_reward_risk: 1.5
  bear_put_evidence_max_debit_frac: 0.45
  bear_put_evidence_max_iv_rank: 60
  bear_put_evidence_require_contract_confirmed: true
  # Apply the same professional execution-quality guard to all approved
  # bull-call debit trades, not just evidence-lane promotions.
  bull_call_approval_max_dte: 45
  bull_call_approval_dte_grace_days: 4 # Soft band: 46-49 DTE is near-limit quality warning; >49 DTE remains blocked
  bull_call_approval_min_reward_risk: 2.0
  bull_call_approval_require_contract_confirmed: true
  # Precision guard from full-folder replay audit:
  # Short-dated bull-call debits with very high historical edge behaved like
  # tail/momentum chases: 40% win rate in replay. Keep Core/Tactical bull calls
  # either longer-dated or more repeatable/moderate-edge.
  bull_call_short_dte_high_edge_block: true
  bull_call_short_dte_high_edge_max_dte: 31
  bull_call_short_dte_high_edge_min_edge_pct: 13.2
  # Regime throttle:
  # High = eligible for Core if all other gates are clean.
  # Medium = Tactical only.
  # Low = Watch/blocked for bull-call debits.
  bull_call_market_regime_enabled: true
  bull_call_low_regime_blocks: true
  bull_call_medium_regime_tactical: true
  bull_call_regime_low_score: 50
  bull_call_regime_high_score: 75
  # Dual-book approvals:
  # Core = full size, Tactical = reduced size when only quality blockers fail.
  enable_dual_books: true
  core_size_mult: 1.00
  tactical_size_mult: 0.50
  enable_scout_book: true
  scout_live_entry_enabled: false     # Scout is research/watch only; live approvals require Core/Tactical.
  scout_size_mult: 0.25
  scout_min_edge_pct: 8.0
  scout_max_edge_pct: 20.0
  scout_block_gex_volatile_breakout: false
  # Pilot Convexity Book:
  # Tiny defined-risk debit ideas can be actionable even when they do not
  # deserve Core/Tactical sizing. Daily discovery still comes only from the
  # dated UW source files plus live Schwab validation.
  enable_pilot_book: true
  pilot_live_entry_enabled: true
  pilot_enter_near_miss_within_tolerance: true
  pilot_size_mult: 0.10
  pilot_max_loss: 150
  pilot_min_ev_ml: 1.50
  pilot_high_pop_min: 0.25
  pilot_floor_pop_min: 0.15
  pilot_min_conviction: 40
  pilot_pass_min_signals: 100
  pilot_pass_min_edge_pct: 1.0
  pilot_min_dte: 5
  pilot_max_dte: 45
  pilot_min_reward_risk: 1.50
  pilot_max_debit_frac: 0.25
  pilot_max_long_otm_pct: 0.15
  enable_native_pilot_book: true
  native_pilot_max_loss: 250
  native_pilot_min_partial_ev_ml: 0.00
  native_pilot_min_signals: 60
  native_pilot_min_edge_pct: 1.0
  native_pilot_require_contract_confirmed: true
  native_pilot_market_confidences: [Medium, High]
  # Backtest-calibrated bearish Scout lane.
  # This is deliberately not a mirrored bull-call rule. The 5-month replay
  # showed broad bear-put rows lose, while a small low-IV / low-VIX pullback
  # subset worked. Keep this Scout-sized only until it earns larger samples.
  allow_bear_put_scout_lane: false
  bear_put_scout_likelihood_strengths: [Moderate, Strong]
  bear_put_scout_require_negative_edge: false
  bear_put_scout_min_signals: 60
  bear_put_scout_min_dte: 14
  bear_put_scout_max_dte: 35
  bear_put_scout_max_iv_rank: 30
  bear_put_scout_max_vix: 20
  bear_put_scout_require_spy_5d_nonnegative: true
  bear_put_scout_min_reward_risk: 2.0
  bear_put_scout_max_debit_frac: 0.35
  tactical_min_conviction: 55
  tactical_min_conviction_grace: 2     # Soft band: tiny score miss is a warning, not a hard cliff
  tactical_min_edge_pct: 6.5          # [T2] was: 5.0 — half-size trades must clear higher edge bar
  tactical_min_signals: 150           # [T2] was: 120 — more historical validation required for tactical
  tactical_min_signals_grace: 5        # Soft band: 145-149 samples should not fail only on rounding
  tactical_require_verdict_pass: true

  # Medium Confidence Book:
  # First-class, separately tracked starter-size book for profitable daily
  # near-misses. It does not loosen Core/Tactical. It requires live-valid
  # pricing, PASS likelihood, enough sample/edge, clean direct contract flow,
  # acceptable debit/width and reward/risk, and only forgives Stage-1 discovery
  # weakness plus modest bull-call DTE overage.
  enable_medium_book: true
  medium_size_mult: 0.25
  medium_allowed_strategies: [Bull Call Debit]
  medium_min_conviction: 40
  medium_min_edge_pct: 8.0
  medium_bear_min_edge_pct: 12.0
  medium_shield_min_edge_pct: 8.0
  medium_min_signals: 120
  medium_require_verdict_pass: true
  medium_min_reward_risk: 1.50
  medium_max_debit_frac: 0.37
  medium_min_dte: 14
  medium_max_dte: 60
  medium_max_iv_rank: 85
  medium_require_contract_confirmed: true
  medium_allowed_market_confidences: [Medium, High]

  # Quant Edge Book:
  # Data-driven small-size lane from the 2026 replay. This does not weaken
  # Core/Tactical. It promotes only live/gate-effective PASS setups with broad
  # historical sample, positive edge, non-extreme IV, and no severe safety
  # blockers. It intentionally allows weak Stage-1 flow/GEX/conviction labels
  # because the replay showed those labels were dropping profitable candidates.
  enable_quant_edge_book: true
  quant_edge_size_mult: 0.25
  quant_edge_allowed_strategies: [Bull Call Debit, Iron Condor]
  quant_edge_allowed_verdicts: [PASS]
  quant_edge_min_edge_pct: 5.0
  quant_edge_min_signals: 150
  quant_edge_min_dte: 30
  quant_edge_max_dte: 60
  quant_edge_min_iv_rank: 30
  quant_edge_max_iv_rank: 85
  quant_edge_max_per_day: 3
  quant_edge_max_per_ticker_day: 1
  quant_edge_disallowed_blocker_substrings:
    - contra
    - live_entry_gate_fail
    - market_regime_block
    - invalid_entry_structure
    - earnings_risk
    - dte_too_long
    - liquidity

  # Short-DTE Edge Book:
  # Separate small-size lane for 21-35 DTE bull-call setups. This is a
  # post-Qualified-Review promotion, not a hard-blocker override. Replay evidence
  # accepted only the stronger edge>=20 subset and rejected research-only,
  # downtrend, earnings, liquidity, missing-GEX, and live-entry failures.
  enable_short_dte_edge_book: true
  short_dte_edge_size_mult: 0.15
  short_dte_edge_allowed_strategies: [Bull Call Debit]
  short_dte_edge_allowed_verdicts: [PASS]
  short_dte_edge_min_edge_pct: 20.0
  short_dte_edge_min_signals: 120
  short_dte_edge_min_confidence_score: 5
  short_dte_edge_min_dte: 21
  short_dte_edge_max_dte: 35
  short_dte_edge_max_iv_rank: 55
  short_dte_edge_max_per_day: 1
  short_dte_edge_max_per_ticker_day: 1
  short_dte_edge_require_qualified_candidate: true
  short_dte_edge_disallowed_blocker_substrings:
    - contra
    - live_entry_gate_fail
    - invalid_entry_structure
    - earnings_risk
    - liquidity
    - pilot_research_only
    - scout_research_only
    - bull_call_downtrend_without_high_vix
    - gex_missing
    - UW_GEX

  # High-Signal Edge Book:
  # Train-first exact backtest found that the pipeline was over-dropping high
  # sample Bull Call Debit candidates in non-mid/range regimes. This lane is
  # deliberately small and capped: it promotes only post-Qualified-Review rows
  # with PASS likelihood, strong sample count, confirmed contract flow, usable
  # GEX context, clean earnings/live/liquidity checks, and no missing-leg/GEX
  # data. It allows 46-60 DTE instead of using the old 45D cliff.
  enable_high_signal_edge_book: true
  high_signal_edge_size_mult: 0.15
  high_signal_edge_allowed_strategies: [Bull Call Debit]
  high_signal_edge_allowed_verdicts: [PASS]
  high_signal_edge_min_edge_pct: 8.0
  high_signal_edge_min_signals: 180
  high_signal_edge_min_confidence_score: 5
  high_signal_edge_min_dte: 21
  high_signal_edge_max_dte: 60
  high_signal_edge_max_iv_rank: 55
  high_signal_edge_max_per_day: 1
  high_signal_edge_max_per_ticker_day: 1
  high_signal_edge_require_qualified_candidate: true
  high_signal_edge_require_contract_flow_confirmed: true
  high_signal_edge_require_gex_context: true
  high_signal_edge_excluded_approval_regimes: [mid/range]
  high_signal_edge_allowed_gex_wall_contexts: []
  high_signal_edge_disallowed_blocker_substrings:
    - contra
    - live_entry_gate_fail
    - invalid_entry_structure
    - earnings_risk
    - liquidity
    - missing_live
    - missing_leg
    - gex_missing
    - UW_GEX

  # Income Book:
  # First-class, separately tracked starter-size book for strict iron-condor
  # income trades. This exists because 2026 replay shows condors can add
  # positive PF, but they were under-generated/under-surfaced versus FIRE debit
  # spreads. Keep it strict: pinned GEX, no directional/contra contract flow,
  # enough historical sample, positive edge, and acceptable IV/DTE.
  enable_income_book: true
  income_size_mult: 0.25
  income_allowed_strategies: [Iron Condor]
  income_min_edge_pct: 5.0
  income_min_signals: 100
  income_min_hist_success_pct: 60.0
  income_min_dte: 28
  income_max_dte: 70
  income_max_iv_rank: 85
  income_allowed_verdicts: [PASS, LOW_SAMPLE]
  income_allowed_gex_regimes: [pinned]
  income_min_credit_no_touch_pct: 0.0

  # Regime Weekly Book:
  # Outcome-mined tactical lane from the full rejected-candidate replay.
  # It fixes the static-regime failure: neutral/range Jan-Feb rewarded
  # contrarian bear debits even when the generic likelihood verdict was FAIL,
  # while high-vol/risk-off Mar-Apr rewarded PASS bull-call continuation.
  # The lane is capped at one setup per day and requires live-valid entry,
  # explicit edge, no earnings risk, acceptable debit/width, and score >= 125.
  enable_regime_weekly_book: true
  regime_weekly_size_mult: 0.35
  regime_weekly_max_per_day: 1
  regime_weekly_max_per_ticker_day: 1
  regime_weekly_min_score: 125.0
  regime_weekly_min_confidence_score: 4
  regime_weekly_promoted_confidence_score: 7
  regime_weekly_min_edge_score: 1
  regime_weekly_min_edge_pct: -20.0
  regime_weekly_min_reward_risk: 1.20
  regime_weekly_max_debit_frac: 0.37
  regime_weekly_min_dte: 14
  regime_weekly_max_dte: 70
  regime_weekly_bear_allowed_verdicts: [FAIL, UNKNOWN]
  regime_weekly_bear_allowed_market_regimes: [neutral, risk_on]
  regime_weekly_bear_excluded_approval_prefixes: ["high/"]
  regime_weekly_bear_min_edge_pct: -20.0
  regime_weekly_bear_max_edge_pct: 0.0
  regime_weekly_bull_allowed_verdicts: [PASS]
  regime_weekly_bull_allowed_approval_prefixes: ["high/"]
  regime_weekly_bull_allowed_market_regimes: []
  regime_weekly_bull_allow_gex_volatile: false
  regime_weekly_bull_min_edge_pct: 0.0
  regime_weekly_enable_income: true
  regime_weekly_income_allowed_verdicts: [PASS]
  regime_weekly_income_min_credit_no_touch_pct: 0.0
  regime_weekly_block_contract_flow_states: [contra, directional]

  # When the directional daily book has no live ENTER rows, run the validated
  # weekly credit-premium engine as a separate Schwab-priced action queue.
  weekly_credit_fallback:
    enabled: true
    always_show: false
    max_rows: 5
    max_candidates_per_day: 8
    top_underlyings: 120
    # Weekly fallback uses the engine's replay-validated floor. The strict daily
    # directional approval book still uses the 25% valid_trade credit floor.
    min_credit_pct_width: 0.18
    min_pop: 0.70
    min_confidence_score: 7
    max_loss_per_contract: 850
    min_iv_rank: 20
    max_leg_spread_pct: 0.25

  # Profit-safety / qualified-candidate model. These add visibility and stricter
  # final approval; they do not loosen credit, POP, or trade-count gates.
  enable_qualified_book: true
  qualified_min_confidence_score: 5
  qualified_min_edge_score: 1
  confidence_high_min_score: 7
  confidence_medium_min_score: 5
  final_validity_gate_enabled: true
  valid_trade_min_pop: 0.60
  valid_trade_min_confidence_score: 5
  valid_trade_min_edge_score: 1
  valid_trade_require_positive_edge_pct: true
  valid_trade_require_likelihood_pass: true
  valid_trade_require_live_price: true
  valid_trade_block_earnings_risk: true
  valid_trade_block_liquidity_flags: true
  valid_trade_min_credit_pct_width: 0.25
  valid_trade_max_credit_pct_width: 0.55
  valid_trade_max_debit_pct_width: 0.45
  valid_trade_min_debit_reward_risk: 1.35
  medium_review_min_pop: 0.60
  medium_review_min_confidence_score: 5
  medium_review_min_edge_score: 1
  medium_block_earnings_risk: true
  high_enter_min_pop: 0.60
  high_enter_preferred_pop: 0.65
  high_enter_min_confidence_score: 7
  high_enter_min_edge_pct: 5.0
  high_enter_require_positive_edge: true
  high_enter_require_clean_flow_or_technical: true

  # Regime-aware approval guardrails.
  approval_regime_rules_enabled: true
  approval_mid_down_block_bull_calls: true
  approval_mid_down_bear_put_min_pop: 0.65
  approval_low_range_debit_max_be_distance_pct: 0.03
  approval_high_down_min_signals: 150
  approval_high_range_breakout_min_edge_pct: 12.0
  approval_high_range_breakout_min_confidence_score: 7
  min_condor_in_output: 2

  # Event Momentum Scout:
  # Controlled tiny-size lane for high-IV/event debit spreads after live
  # confirmation. This is not Core/Tactical and never overrides live entry,
  # contra contract flow, or bad debit/width. It exists so INTC-style post-event
  # breakouts can become actionable instead of hidden or permanently Watch.
  enable_event_momentum_scout: true
  event_momentum_scout_min_conviction: 30
  event_momentum_scout_max_dte: 35
  event_momentum_scout_min_reward_risk: 1.8
  event_momentum_scout_max_debit_frac: 0.35
  event_momentum_scout_require_contract_confirmed: true
  event_momentum_scout_require_breakeven_cross: true

  # Debit Momentum Scout:
  # Controlled middle lane for high-quality FIRE debit near-misses that were
  # blocked only by Stage-1 discovery weakness. This is not a Core/Tactical
  # loosening. It stays tiny-size and still requires live entry, positive edge,
  # contract-flow confirmation, acceptable reward/risk, IV discipline, and a
  # supportive strategy-aware regime score. It never overrides contra flow,
  # live-entry failure, invalidation, delta, GEX uncertainty, or bad debit/width.
  allow_debit_momentum_scout_lane: true
  debit_momentum_scout_min_conviction: 40
  debit_momentum_scout_min_edge_pct: 8.0
  debit_momentum_scout_bear_min_edge_pct: 12.0
  debit_momentum_scout_min_signals: 100
  debit_momentum_scout_min_dte: 14
  debit_momentum_scout_max_dte: 45
  debit_momentum_scout_min_reward_risk: 2.0
  debit_momentum_scout_max_debit_frac: 0.35
  debit_momentum_scout_max_iv_rank: 80
  debit_momentum_scout_require_contract_confirmed: true
  debit_momentum_scout_require_verdict_pass: false
  debit_momentum_scout_min_regime_score: 50
  debit_momentum_scout_bear_likelihood_strengths: [Moderate, Strong]
  debit_momentum_scout_bear_require_flow_confirmed: true
  debit_momentum_scout_block_gex_volatile_breakout: false

  # Backtest-promoted Tactical lane:
  # Pinned-resistance bull-call continuations with PASS likelihood, Moderate+
  # strength, confirmed contract flow, 31-45 DTE, and strong live R/R had
  # positive realized quality in replay. This lane does not forgive live entry,
  # contra flow, LOW_SAMPLE/FAIL verdicts, long DTE, weak strength, or short-DTE
  # high-edge chase setups.
  allow_bull_call_pinned_continuation_lane: true
  bull_call_pinned_continuation_min_edge_pct: 8.0
  bull_call_pinned_continuation_min_signals: 120
  bull_call_pinned_continuation_min_conviction: 40
  bull_call_pinned_continuation_core_min_conviction: 55
  bull_call_pinned_continuation_min_dte: 31
  bull_call_pinned_continuation_max_dte: 45
  bull_call_pinned_continuation_min_reward_risk: 2.0
  bull_call_pinned_continuation_max_debit_frac: 0.35
  bull_call_pinned_continuation_min_likelihood_strength: Moderate
  bull_call_pinned_continuation_allowed_gex_contexts: [pinned_resistance_above_call_wall]
  bull_call_pinned_continuation_allowed_regime_confidences: [Medium, High]
  bull_call_pinned_continuation_require_contract_confirmed: true
  bull_call_pinned_continuation_block_short_dte_high_edge: true

  # Width-based entry gate tolerance (professional swing-trade standard).
  # Formula: tolerance = max(entry_tolerance_floor, spread_width × entry_tolerance_width_pct)
  # For a $15 spread at 2.5%: max(0.25, 15*0.025) = max(0.25, 0.375) = $0.375
  entry_tolerance_width_pct: 0.05    # [T6] was: 0.025 — widened to 5% to handle ATM strike premium drift
  entry_tolerance_floor: 0.30        # [T6] was: 0.25 — slight increase; ATM strikes have larger bid-ask
  require_spot_alignment: true
  spot_alignment_require_live: true
  max_spot_asof_drift_pct: 0.50       # [T6] was: 0.20 — too tight, rejecting valid trades on minor drift
  max_bull_call_long_otm_pct: 0.08
  max_bear_put_long_otm_pct: 0.08
  exclude_debit_moneyness_fail_from_output: true

  require_invalidation_clear: true
  block_invalidation_warning: false
  invalidation_eval_mode: auto
  invalidation_close_confirmations: 2
  enable_restrike_optimizer: true

  # Guard against low-quality SHIELD approvals.
  require_shield_sigma_pass: true
  shield_sigma_require_data: true
  require_shield_core: false
  require_live_shield_short_delta: true
  max_abs_short_delta_shield: 0.20       # static fallback (used when shield_delta_dynamic: false)
  shield_delta_dynamic: true             # dynamic cap: IVR/DTE/VIX/GEX-aware (professional practice)
  # FIRE delta gate: reject lottery tickets with low directional exposure
  require_fire_long_delta: true
  min_abs_long_delta_fire: 0.15
  allow_fire_delta_moneyness_proxy: true
  fire_delta_proxy_max_long_otm_pct: 0.02
  # GEX regime gate: block regime-mismatched trades
  require_gex_regime: true
  min_fire_pinned_gex_abs: 10000000   # require at least $10M pinned GEX before downgrading FIRE out of Core
  fire_volatile_breakout_tactical_only: true
  fire_missing_gex_context_tactical_only: true
  fire_pinned_no_wall_tactical_only: true
  gex_fallback_tactical_only: true        # fallback GEX can never produce Core
  gex_fallback_requires_clean_non_gex: true # fallback GEX needs clean non-GEX evidence to stay Tactical

  # Keep very speculative structures out of approved set.
  disallow_confidence_tiers: [REJECT, LOTTO]

  enforce_pretrade_portfolio_caps: true
  block_same_underlying_option_overlap: true
  pretrade_caps_require_data: false

high_beta:
  tickers: [TSLA, NVDA, MU, PLTR]
  min_dte: 28
  min_otm_pct: 0.10
  iv30d_override_threshold: 0.90
  require_short_delta_for_core: true

playbook:
  daily:
    daily_loss_stop_cash: 1000
